<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电路可视化搭建</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: #eef2f8; overflow: hidden; color: #1e2f4a;
  }
  .app { display: flex; height: 100vh; }

  .palette {
    width: 258px; flex: 0 0 258px;
    background: #fff; border-right: 1px solid #dbe3ee;
    display: flex; flex-direction: column;
    padding: 14px 14px 12px; gap: 12px;
    overflow-y: auto; box-shadow: 2px 0 14px -8px rgba(30,47,74,.25);
    z-index: 5;
  }
  .palette h1 {
    font-size: 1rem; font-weight: 700; margin: 0;
    display: flex; align-items: center; gap: 6px; color: #1a2b4c;
  }
  .palette h1 small { font-weight: 500; font-size: .68rem; color: #7d8db0; margin-left: auto; }
  .palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pal-item {
    background: #f7f9fd; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 6px 4px 4px; display: flex; flex-direction: column;
    align-items: center; cursor: grab; user-select: none;
    transition: background .15s, border-color .15s, transform .1s;
    touch-action: none;
  }
  .pal-item:hover { background: #eef4ff; border-color: #9bbcf7; transform: translateY(-1px); }
  .pal-item:active { cursor: grabbing; }
  .pal-item svg { width: 100%; height: 58px; display: block; }
  .pal-item span { font-size: 11px; color: #2c3e5a; margin-top: 2px; white-space: nowrap; }

  .workspace {
    flex: 1; position: relative; overflow: hidden;
    background-color: #f7f9fd;
    background-image: radial-gradient(#cbd8ea 1.2px, transparent 1.2px);
    background-size: 20px 20px;
  }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  .tip {
    position: absolute; left: 14px; bottom: 12px;
    font-size: .74rem; color: #7d8db0; background: rgba(255,255,255,.85);
    padding: 6px 12px; border-radius: 20px; border: 1px solid #e2e8f0;
    pointer-events: none; backdrop-filter: blur(3px);
  }

  .readout {
    position: absolute; top: 58px; right: 14px;
    background: rgba(255,255,255,.96);
    border: 1px solid #dbe3ee; border-radius: 14px;
    padding: 12px 15px; min-width: 226px;
    font-size: .78rem; color: #1e2f4a;
    box-shadow: 0 8px 26px -12px rgba(30,47,74,.35);
    backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 6;
  }
  .readout .ro-title {
    font-weight: 700; font-size: .82rem; color: #2563eb;
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .readout .ro-teacher {
    font-size: .72rem; font-weight: 700; color: #1d4ed8;
    background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 8px; padding: 5px 8px; margin-bottom: 8px;
    text-align: center; letter-spacing: .02em;
  }
  .readout .ro-row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 3px 0; color: #4a5c7a;
  }
  .readout .ro-row b { color: #1e2f4a; font-variant-numeric: tabular-nums; }
  .readout .ro-row b.ok  { color: #16a34a; }
  .readout .ro-row b.off { color: #dc2626; }
  .readout .ro-sep { height: 1px; background: #e6ecf5; margin: 7px 0; }
  .readout .ro-sub { font-size: .7rem; color: #94a3b8; text-align: center; padding-top: 4px; }

  .bottom-dock {
    position: absolute;
    right: 14px; bottom: 14px;
    width: 246px;
    background: rgba(255,255,255,.97);
    border: 1px solid #dbe3ee;
    border-radius: 16px;
    padding: 14px 15px 13px;
    box-shadow: 0 10px 32px -14px rgba(30,47,74,.4);
    backdrop-filter: blur(8px);
    z-index: 7;
    max-height: calc(100% - 250px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bottom-dock::-webkit-scrollbar { width: 8px; }
  .bottom-dock::-webkit-scrollbar-thumb { background: #d5deeb; border-radius: 8px; }

  .props {
    display: flex; flex-direction: column; gap: 8px;
    min-height: 56px;
  }
  .props-empty { font-size: .76rem; color: #8b9ab5; text-align: center; padding: 14px 6px; line-height: 1.6; }
  .props-title { font-size: .8rem; font-weight: 700; color: #2563eb; }
  .props label { font-size: .78rem; display: flex; align-items: center; gap: 6px; color: #3c4d6b; }
  .props input[type=number] {
    width: 78px; padding: 4px 7px; border: 1px solid #cfd9e8; border-radius: 8px;
    font-size: .8rem; font-family: inherit; color: #1e2f4a; outline: none;
  }
  .props input[type=number]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px #dbeafe; }
  .props input[type=number]:disabled {
    background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; cursor: not-allowed;
  }
  .props input[type=range] {
    width: 100%; height: 6px;
    -webkit-appearance: none; appearance: none;
    background: #e2e8f0; border-radius: 3px; outline: none; cursor: pointer;
    margin: 2px 0;
  }
  .props input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #3b82f6; cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .props input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #3b82f6; cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .props input[type=range]:disabled { opacity: .5; cursor: not-allowed; }
  .props .slider-row { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .props .rotate-btn {
    margin-top: 4px; padding: 6px; border: 1px solid #bfdbfe; background: #eff6ff;
    color: #1d4ed8; border-radius: 9px; font-size: .76rem; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .props .rotate-btn:hover { background: #dbeafe; }
  .props .rotate-btn:disabled {
    background: #f8fafc; color: #cbd5e1; border-color: #e2e8f0; cursor: not-allowed;
  }
  .props .del-btn {
    margin-top: 2px; padding: 6px; border: 1px solid #fecaca; background: #fff5f5;
    color: #dc2626; border-radius: 9px; font-size: .76rem; cursor: pointer; font-family: inherit;
  }
  .props .del-btn:hover { background: #fee2e2; }
  .props .del-btn:disabled {
    background: #f8fafc; color: #cbd5e1; border-color: #e2e8f0;
    cursor: not-allowed;
  }
  .props .hint {
    font-size: .72rem; color: #94a3b8; line-height: 1.6;
    text-align: left; padding: 2px 2px 0;
  }
  .props .lock-hint {
    font-size: .72rem; color: #b45309; line-height: 1.6;
    background: #fffbeb; border: 1px solid #fde68a;
    border-radius: 8px; padding: 6px 8px; text-align: left;
  }

  .tools {
    padding-top: 10px;
    border-top: 1px solid #e6ecf5;
  }
  .tools button {
    width: 100%; padding: 7px; border: 1px solid #cfd9e8; background: #f7f9fd;
    color: #3c4d6b; border-radius: 10px; font-size: .78rem; cursor: pointer; font-family: inherit;
  }
  .tools button:hover { background: #eef4ff; border-color: #9bbcf7; color: #2563eb; }

  .teacher-bar {
    position: fixed;
    top: 12px; right: 14px;
    display: flex; align-items: center; gap: 6px;
    z-index: 10001;
  }
  .teacher-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    font-size: .8rem; font-weight: 600; color: #334155;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px -6px rgba(30,47,74,.35);
    transition: all .15s;
    white-space: nowrap;
  }
  .teacher-btn:hover {
    border-color: #93c5fd; color: #1d4ed8; background: #eff6ff;
  }
  .teacher-btn.active {
    background: #eff6ff; border-color: #60a5fa; color: #1d4ed8;
    box-shadow: 0 4px 16px -6px rgba(37,99,235,.45);
  }
  .teacher-exit {
    display: none;
    padding: 7px 12px;
    background: #fff;
    border: 1px solid #fecaca;
    border-radius: 20px;
    font-size: .78rem; color: #dc2626;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px -6px rgba(30,47,74,.35);
    transition: background .15s;
    white-space: nowrap;
  }
  .teacher-exit.show { display: inline-block; }
  .teacher-exit:hover { background: #fef2f2; }

  .teacher-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.42);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20000;
  }
  .teacher-modal.show { display: flex; }

  .tm-card {
    width: 340px;
    background: #fff;
    border-radius: 22px;
    padding: 28px 30px 24px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 28px 70px -20px rgba(30,47,74,.6);
    animation: tmIn .26s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes tmIn {
    from { opacity: 0; transform: scale(.9) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .tm-icon { font-size: 2.2rem; margin-bottom: 4px; }
  .tm-title { font-size: 1.05rem; font-weight: 800; color: #1e2f4a; }
  .tm-sub { font-size: .74rem; color: #8b9ab5; margin-top: 4px; margin-bottom: 16px; text-align: center; }
  .tm-card input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #cfd9e8;
    border-radius: 12px;
    font-size: .95rem;
    font-family: inherit;
    letter-spacing: .18em;
    text-align: center;
    color: #1e2f4a;
    outline: none;
    text-transform: uppercase;
    transition: border-color .15s, box-shadow .15s;
  }
  .tm-card input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px #dbeafe;
  }
  .tm-card input::placeholder {
    letter-spacing: .12em; color: #b6c2d6; font-size: .82rem;
  }
  .tm-error {
    width: 100%;
    min-height: 20px;
    font-size: .72rem;
    color: #dc2626;
    text-align: center;
    padding-top: 6px;
  }
  .tm-actions {
    width: 100%;
    display: flex; gap: 10px;
    margin-top: 8px;
  }
  .tm-actions button {
    flex: 1;
    padding: 9px;
    border-radius: 11px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .tm-cancel {
    background: #f7f9fd; border: 1px solid #dbe3ee; color: #64748b;
  }
  .tm-cancel:hover { background: #eef2f8; }
  .tm-confirm {
    background: #2563eb; border: 1px solid #2563eb; color: #fff;
  }
  .tm-confirm:hover { background: #1d4ed8; border-color: #1d4ed8; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .tm-card input.shake { animation: shake .4s; border-color: #fca5a5; }

  .welcome-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.82);
    background: linear-gradient(145deg, #ffffff, #eff6ff);
    border: 2px solid #93c5fd;
    border-radius: 26px;
    padding: 30px 56px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    box-shadow: 0 28px 70px -20px rgba(37,99,235,.5);
    z-index: 15000; opacity: 0; pointer-events: none;
    transition: opacity .28s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .welcome-card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .welcome-card .wc-icon { font-size: 2.6rem; margin-bottom: 4px; }
  .welcome-card .wc-title {
    font-size: .78rem; color: #64748b; letter-spacing: .12em;
  }
  .welcome-card .wc-name {
    font-size: 1.45rem; font-weight: 800; color: #1d4ed8;
    letter-spacing: .02em;
  }
  .welcome-card .wc-sub {
    font-size: .72rem; color: #94a3b8; margin-top: 6px;
    background: #dbeafe; padding: 3px 12px; border-radius: 12px;
  }

  .toast-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: #fff;
    border: 2px solid #dc2626;
    border-radius: 22px;
    padding: 26px 42px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 24px 60px -18px rgba(220,38,38,.55), 0 0 0 1px rgba(220,38,38,.08);
    z-index: 9999; opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .toast-card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast-card .tc-icon {
    font-size: 2.6rem; line-height: 1;
    animation: pulseIcon .8s ease-in-out infinite alternate;
  }
  @keyframes pulseIcon { from { transform: scale(1); } to { transform: scale(1.16); } }
  .toast-card .tc-title { font-size: 1.15rem; font-weight: 800; color: #dc2626; letter-spacing: .02em; }
  .toast-card .tc-sub { font-size: .82rem; color: #64748b; }

  .breath-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 42px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(90deg, #fef3c7, #fde68a, #fef3c7);
    border-bottom: 2px solid #f59e0b;
    font-size: .85rem; font-weight: 700; color: #92400e;
    z-index: 10000;
    transform: translateY(-100%);
    transition: transform .32s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    box-shadow: 0 4px 22px -8px rgba(245,158,11,.7);
    letter-spacing: .01em;
  }
  .breath-bar.show {
    transform: translateY(0);
    animation: breathGlow 1.4s ease-in-out infinite;
  }
  @keyframes breathGlow {
    0%, 100% {
      background: linear-gradient(90deg, #fef3c7, #fde68a, #fef3c7);
      box-shadow: 0 4px 18px -8px rgba(245,158,11,.6);
    }
    50% {
      background: linear-gradient(90deg, #fde68a, #fbbf24, #fde68a);
      box-shadow: 0 6px 30px -6px rgba(245,158,11,.95);
    }
  }

  svg .w {
    stroke: #1e2f4a; stroke-width: 2.4; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  svg .thick { stroke-width: 3.2; }
  svg .filldark { fill: #1e2f4a; stroke: none; }
  svg .symtext {
    font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 22px;
    fill: #1e2f4a; text-anchor: middle; dominant-baseline: central;
  }
  svg .refletter {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic; font-weight: 700;
    fill: #2563eb; text-anchor: middle;
  }

  #canvas .element { cursor: grab; }
  #canvas .element:active { cursor: grabbing; }
  #canvas .element.selected .w,
  #canvas .element.selected .thick { stroke: #2563eb; }
  #canvas .element.selected .filldark { fill: #2563eb; }
  #canvas .element.selected .refletter { fill: #1d4ed8; }
  #canvas .el-label {
    font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600;
    fill: #5e6f8d; text-anchor: middle; pointer-events: none;
  }
  #canvas .el-readout {
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 12px; font-weight: 700;
    fill: #0f766e; text-anchor: middle; pointer-events: none;
  }
  #canvas .dot-t { fill: #3b82f6; stroke: #ffffff; stroke-width: 1.4; pointer-events: none; }
  #canvas .hit { fill: transparent; cursor: crosshair; }
  #canvas .hit:hover + .dot-t { fill: #1d4ed8; }
  #canvas .wire-line {
    stroke: #2563eb; stroke-width: 2.6; fill: none;
    stroke-linecap: square; stroke-linejoin: miter;
    transition: stroke .12s;
  }
  #canvas .wire-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  #canvas .wire:hover .wire-line { stroke: #60a5fa; }
  #canvas .wire.selected .wire-line { stroke: #dc2626; }
  #canvas .temp-wire {
    stroke: #3b82f6; stroke-width: 2.4; fill: none;
    stroke-dasharray: 6 5; pointer-events: none;
    stroke-linecap: square; stroke-linejoin: miter;
  }

  .ghost {
    position: fixed; width: 122px; height: 82px; pointer-events: none;
    transform: translate(-50%, -50%); opacity: .78; z-index: 999;
  }
  .ghost svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="breath-bar" id="breathBar"></div>

  <div class="teacher-bar">
    <button class="teacher-btn" id="teacherBtn">👩‍🏫 教师模式</button>
    <button class="teacher-exit" id="teacherExit">退出</button>
  </div>

  <div class="teacher-modal" id="teacherModal">
    <div class="tm-card">
      <div class="tm-icon">👩‍🏫</div>
      <div class="tm-title">教师模式</div>
      <div class="tm-sub">请输入姓名首字母（不区分大小写）</div>
      <input type="text" id="teacherInput" placeholder="例如 SAY" maxlength="8" autocomplete="off" spellcheck="false">
      <div class="tm-error" id="teacherError"></div>
      <div class="tm-actions">
        <button class="tm-cancel" id="teacherCancel">取消</button>
        <button class="tm-confirm" id="teacherConfirm">进入</button>
      </div>
    </div>
  </div>

  <div class="welcome-card" id="welcomeCard">
    <div class="wc-icon">👩‍🏫</div>
    <div class="wc-title">欢迎您</div>
    <div class="wc-name">孙爱云老师</div>
    <div class="wc-sub">教师模式已开启</div>
  </div>

  <div class="toast-card" id="toastCard">
    <div class="tc-icon">⚡</div>
    <div class="tc-title">电源短路</div>
    <div class="tc-sub">电流极大，请立即检查电路连接</div>
  </div>

<div class="app">
  <aside class="palette">
    <h1>⚡ 元件库 <small>拖到右侧</small></h1>
    <div class="palette-grid" id="paletteGrid"></div>
  </aside>

  <main class="workspace">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="readout" id="readout"></div>

    <div class="bottom-dock">
      <div class="props" id="propsPanel"></div>
      <div class="tools">
        <button id="clearBtn">清空画布</button>
      </div>
    </div>

    <div class="tip">JHC保留所有权利</div>
  </main>
</div>

<script>
/* =========================================================
   1. 教师表 & 教师模式状态
   ========================================================= */
const TEACHERS = {
  'SAY': '孙爱云',
  '848':  'JHC',
  'LX':  '李霞',
  'WY':  '王勇'
};

let teacherMode = false;
let teacherName = '';
let teacherCode = '';

const teacherBtn    = document.getElementById('teacherBtn');
const teacherExit   = document.getElementById('teacherExit');
const teacherModal  = document.getElementById('teacherModal');
const teacherInput  = document.getElementById('teacherInput');
const teacherError  = document.getElementById('teacherError');
const teacherCancel = document.getElementById('teacherCancel');
const teacherConfirm= document.getElementById('teacherConfirm');
const welcomeCard   = document.getElementById('welcomeCard');

let welcomeTimer = null;

function openTeacherModal() {
  teacherInput.value = '';
  teacherError.textContent = '';
  teacherModal.classList.add('show');
  setTimeout(() => teacherInput.focus(), 60);
}

function closeTeacherModal() {
  teacherModal.classList.remove('show');
}

function showTeacherError(msg) {
  teacherError.textContent = msg;
  teacherInput.classList.add('shake');
  setTimeout(() => teacherInput.classList.remove('shake'), 420);
  teacherInput.focus();
  teacherInput.select();
}

function tryEnterTeacher() {
  const raw = teacherInput.value.trim().toUpperCase().replace(/[\s,，、.]/g, '');
  if (!raw) { showTeacherError('请输入姓名首字母'); return; }
  const name = TEACHERS[raw];
  if (!name) { showTeacherError('未找到该教师，请检查首字母'); return; }

  teacherMode = true;
  teacherName = name;
  teacherCode = raw;

  closeTeacherModal();
  updateTeacherBtn();
  showWelcome(name);
  refresh();
}

function exitTeacherMode() {
  teacherMode = false;
  teacherName = '';
  teacherCode = '';
  updateTeacherBtn();
  refresh();
}

function updateTeacherBtn() {
  if (teacherMode) {
    teacherBtn.innerHTML = `👩‍🏫 ${teacherName}老师`;
    teacherBtn.classList.add('active');
    teacherExit.classList.add('show');
  } else {
    teacherBtn.innerHTML = `👩‍🏫 教师模式`;
    teacherBtn.classList.remove('active');
    teacherExit.classList.remove('show');
  }

/* =========================================================
   6. 旋转工具
   ========================================================= */
/** 二维点按角度旋转（度） */
function rotPt(p, deg) {
  if (!deg) return { x: p.x, y: p.y };
  const rad = deg * Math.PI / 180;
  const c = Math.cos(rad), s = Math.sin(rad);
  return {
    x: Math.round(p.x * c - p.y * s),
    y: Math.round(p.x * s + p.y * c)
  };
}

/** 元件本地坐标（未旋转） */
function getTermLocalPos(el, termIndex) {
  const t = SHAPES[el.type].terminals[termIndex];
  if (!t) return null;
  if (el.type === 'rheostat' && termIndex === 2) {
    const ratio = rheoRatio(el);
    return { x: -20 + ratio * 40, y: -38 };
  }
  return { x: t.x, y: t.y };
}

/** 元件全局坐标（含旋转），带 dir 方向 */
function getTermGlobal(el, termIndex) {
  const local = getTermLocalPos(el, termIndex);
  if (!local) return null;
  const t = SHAPES[el.type].terminals[termIndex];
  const rot = el.rotation || 0;
  const pos = rotPt(local, rot);
  const dirRaw = rotPt({ x: t.dx, y: t.dy }, rot);
  /* 方向归一化（只保留 ±1 或 0） */
  const dir = {
    x: Math.abs(dirRaw.x) > 0.5 ? Math.sign(dirRaw.x) : 0,
    y: Math.abs(dirRaw.y) > 0.5 ? Math.sign(dirRaw.y) : 0
  };
  return {
    pos: { x: el.x + pos.x, y: el.y + pos.y },
    dir
  };
}

function getTerm(ref) {
  const el = elements.find(e => e.id === ref.el);
  if (!el) return null;
  return getTermGlobal(el, ref.term);
}

function isTermVisible(el, termIndex) {
  if (el.type === 'rheostat') {
    if (termIndex === 0) return !isRheoTermConnected(el.id, 1);
    if (termIndex === 1) return !isRheoTermConnected(el.id, 0);
  }
  return true;
}

/* =========================================================
   7. 布线
   ========================================================= */
function dedupe(pts) {
  const out = [];
  for (const p of pts) {
    const l = out[out.length - 1];
    if (!l || Math.abs(l.x - p.x) > 0.01 || Math.abs(l.y - p.y) > 0.01) out.push(p);
  }
  return out;
}

function pickBridgeY(a1, b1, OUTER) {
  let y = Math.min(a1.y, b1.y) - OUTER;
  if (y < 8) y = Math.max(a1.y, b1.y) + OUTER;
  return y;
}
function pickBridgeX(a1, b1, OUTER) {
  let x = Math.min(a1.x, b1.x) - OUTER;
  if (x < 8) x = Math.max(a1.x, b1.x) + OUTER;
  return x;
}

function routeWire(pA, dA, pB, dB) {
  const S      = 30;
  const OUTER  = 36;
  const a1 = { x: pA.x + dA.x * S, y: pA.y + dA.y * S };
  const b1 = { x: pB.x + dB.x * S, y: pB.y + dB.y * S };
  const pts = [{ x: pA.x, y: pA.y }, a1];

  const hA = Math.abs(dA.x) > 0.5;
  const hB = Math.abs(dB.x) > 0.5;
  const dx = b1.x - a1.x, dy = b1.y - a1.y;

  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
    /* 引出点重合 */
  }
  else if (hA && hB) {
    if (Math.abs(dy) < 2) {
      const towardB = (b1.x - a1.x) * dA.x > 0;
      const faceToFace = (dA.x * dB.x < 0) && towardB;
      if (!faceToFace) {
        const bridgeY = pickBridgeY(a1, b1, OUTER);
        pts.push({ x: a1.x, y: bridgeY }, { x: b1.x, y: bridgeY });
      }
    } else if (dA.x * dB.x > 0) {
      const sign = dA.x;
      const outerX = sign > 0
        ? Math.max(a1.x, b1.x) + OUTER
        : Math.min(a1.x, b1.x) - OUTER;
      pts.push({ x: outerX, y: a1.y }, { x: outerX, y: b1.y });
    } else {
      const my = a1.y + dy / 2;
      pts.push({ x: a1.x, y: my }, { x: b1.x, y: my });
    }
  }
  else if (!hA && !hB) {
    if (Math.abs(dx) < 2) {
      const towardB = (b1.y - a1.y) * dA.y > 0;
      const faceToFace = (dA.y * dB.y < 0) && towardB;
      if (!faceToFace) {
        const bridgeX = pickBridgeX(a1, b1, OUTER);
        pts.push({ x: bridgeX, y: a1.y }, { x: bridgeX, y: b1.y });
      }
    } else if (dA.y * dB.y > 0) {
      const sign = dA.y;
      const outerY = sign > 0
        ? Math.max(a1.y, b1.y) + OUTER
        : Math.min(a1.y, b1.y) - OUTER;
      pts.push({ x: a1.x, y: outerY }, { x: b1.x, y: outerY });
    } else {
      const mx = a1.x + dx / 2;
      pts.push({ x: mx, y: a1.y }, { x: mx, y: b1.y });
    }
  }
  else if (hA && !hB) {
    pts.push({ x: a1.x, y: b1.y });
  } else {
    pts.push({ x: b1.x, y: a1.y });
  }

  pts.push(b1, { x: pB.x, y: pB.y });
  return dedupe(pts);
}

function rectPath(pts) {
  if (pts.length < 2) return '';
  const f = n => n.toFixed(1);
  let d = `M ${f(pts[0].x)} ${f(pts[0].y)}`;
  for (let i = 1; i < pts.length; i++) d += ` L ${f(pts[i].x)} ${f(pts[i].y)}`;
  return d;
}

function tempPath(A, mouse) {
  const S = 30;
  const a1 = { x: A.pos.x + A.dir.x * S, y: A.pos.y + A.dir.y * S };
  const pts = [{ x: A.pos.x, y: A.pos.y }, a1];
  const hA = Math.abs(A.dir.x) > 0.5;

  if (hA) {
    if (Math.abs(mouse.y - a1.y) > 2) pts.push({ x: a1.x, y: mouse.y });
  } else {
    if (Math.abs(mouse.x - a1.x) > 2) pts.push({ x: mouse.x, y: a1.y });
  }
  pts.push({ x: mouse.x, y: mouse.y });
  return rectPath(dedupe(pts));
}

/* =========================================================
   8. 线性方程组求解
   ========================================================= */
function solveLinear(A, z) {
  const n = z.length;
  if (n === 0) return [];
  const M = A.map((row, i) => row.concat([z[i]]));
  const where = new Array(n).fill(-1);
  let row = 0;

  for (let col = 0; col < n && row < n; col++) {
    let piv = -1, best = 1e-12;
    for (let r = row; r < n; r++) {
      if (Math.abs(M[r][col]) > best) { best = Math.abs(M[r][col]); piv = r; }
    }
    if (piv < 0) continue;
    [M[row], M[piv]] = [M[piv], M[row]];
    where[col] = row;

    const p = M[row][col];
    for (let c = col; c <= n; c++) M[row][c] /= p;

    for (let r = 0; r < n; r++) {
      if (r === row) continue;
      const f = M[r][col];
      if (f === 0) continue;
      for (let c = col; c <= n; c++) M[r][c] -= f * M[row][c];
    }
    row++;
  }

  const x = new Array(n).fill(0);
  for (let c = 0; c < n; c++) if (where[c] >= 0) x[c] = M[where[c]][n];
  return x.map(v => (isFinite(v) ? v : 0));
}

/* =========================================================
   9. 电路仿真
   ========================================================= */
const LAMP_R      = 10;
const BELL_R      = 10;
const MOTOR_R     = 20;
const AMMETER_R   = 0.01;
const LIT_CURRENT = 0.005;
const SHORT_I     = 300;

function simulate() {
  const res = {
    hasSource: false, sourceVoltage: 0, totalCurrent: 0,
    status: '断路', elements: {}, shortCircuit: false, live: false
  };
  elements.forEach(el => { el._lit = false; });

  if (!elements.length) { simResult = res; return; }

  const parent = new Map();
  const find = x => {
    let r = x;
    while (parent.get(r) !== r) r = parent.get(r);
    while (parent.get(x) !== r) { const n = parent.get(x); parent.set(x, r); x = n; }
    return r;
  };
  const union = (a, b) => {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };
  const tk = (elId, ti) => elId + '#' + ti;

  for (const el of elements) {
    SHAPES[el.type].terminals.forEach((_, i) => {
      const k = tk(el.id, i);
      if (!parent.has(k)) parent.set(k, k);
    });
  }
  for (const w of wires) union(tk(w.a.el, w.a.term), tk(w.b.el, w.b.term));
  for (const el of elements) {
    if (el.type === 'switch' && el.props.closed) union(tk(el.id, 0), tk(el.id, 1));
  }

  const nodeOf = new Map();
  const nodeList = [];
  for (const k of parent.keys()) {
    const r = find(k);
    if (!nodeOf.has(r)) { nodeOf.set(r, nodeList.length); nodeList.push(r); }
  }
  const nodeIdx = k => nodeOf.get(find(k));
  const N = nodeList.length;

  const resistors = [];
  const sources   = [];

  for (const el of elements) {
    const na = nodeIdx(tk(el.id, 0));
    const nb = nodeIdx(tk(el.id, 1));
    switch (el.type) {
      case 'battery':
        sources.push({ a: na, b: nb, E: el.props.voltage, el }); break;
      case 'switch': break;
      case 'voltmeter': break;
      case 'ammeter':
        resistors.push({ a: na, b: nb, R: AMMETER_R, el }); break;
      case 'lamp':
        resistors.push({ a: na, b: nb, R: LAMP_R, el }); break;
      case 'bell':
        resistors.push({ a: na, b: nb, R: BELL_R, el }); break;
      case 'motor':
        resistors.push({ a: na, b: nb, R: MOTOR_R, el }); break;
      case 'resistor':
        resistors.push({ a: na, b: nb, R: Math.max(Number(el.props.resistance) || 0, 0.001), el }); break;
      case 'rheostat': {
        const n0 = nodeIdx(tk(el.id, 0));
        const n1 = nodeIdx(tk(el.id, 1));
        const n2 = nodeIdx(tk(el.id, 2));
        const max = Math.max(Number(el.props.max) || 20, 0.001);
        const rawR = Number(el.props.resistance);
        const rValue = isNaN(rawR) ? max / 2 : Math.max(0, Math.min(rawR, max));
        const r1 = Math.max(rValue, 0.001);
        const r2 = Math.max(max - rValue, 0.001);
        resistors.push({ a: n0, b: n2, R: r1, el: null });
        resistors.push({ a: n2, b: n1, R: r2, el: null });
        break;
      }
      case 'resistanceBox':
        resistors.push({ a: na, b: nb, R: Math.max(Number(el.props.resistance) || 0, 0.001), el }); break;
    }
  }

  if (!sources.length) { simResult = res; return; }

  res.hasSource = true;
  res.sourceVoltage = sources[0].E;

  let directShort = false;
  for (const s of sources) {
    if (s.a === s.b) { directShort = true; break; }
  }
  if (directShort) {
    res.shortCircuit = true;
    res.live = true;
    res.status = '短路';
    simResult = res;
    return;
  }

  const ground = sources[0].b;
  const rowOf = new Array(N).fill(-1);
  let Mn = 0;
  for (let i = 0; i < N; i++) if (i !== ground) rowOf[i] = Mn++;

  const m = sources.length;
  const size = Mn + m;
  if (size === 0) { simResult = res; return; }

  const A = Array.from({ length: size }, () => new Array(size).fill(0));
  const z = new Array(size).fill(0);

  for (let i = 0; i < Mn; i++) A[i][i] += 1e-9;

  for (const r of resistors) {
    const g = 1 / r.R;
    const ra = rowOf[r.a], rb = rowOf[r.b];
    if (ra >= 0) A[ra][ra] += g;
    if (rb >= 0) A[rb][rb] += g;
    if (ra >= 0 && rb >= 0) { A[ra][rb] -= g; A[rb][ra] -= g; }
  }

  sources.forEach((s, k) => {
    const col = Mn + k;
    const ra = rowOf[s.a], rb = rowOf[s.b];
    if (ra >= 0) { A[ra][col] += 1; A[col][ra] += 1; }
    if (rb >= 0) { A[rb][col] -= 1; A[col][rb] -= 1; }
    z[col] = s.E;
  });

  const x = solveLinear(A, z);

  const V = new Array(N).fill(0);
  for (let i = 0; i < N; i++) if (i !== ground) V[i] = x[rowOf[i]];

  let live = false;
  for (const r of resistors) {
    const u = V[r.a] - V[r.b];
    const i = u / r.R;
    if (Math.abs(i) > 1e-3) live = true;

    if (!r.el) continue;
    const info = { voltage: Math.abs(u), current: i, lit: false };
    if (r.el.type === 'lamp' && Math.abs(i) > LIT_CURRENT) {
      info.lit = true;
      r.el._lit = true;
    }
    res.elements[r.el.id] = info;
  }

  let overload = false;
  sources.forEach((s, k) => {
    const i = x[Mn + k];
    res.elements[s.el.id] = { voltage: s.E, current: i };
    if (Math.abs(i) > SHORT_I) overload = true;
  });

  for (const el of elements) {
    if (el.type === 'voltmeter') {
      const na = nodeIdx(tk(el.id, 0));
      const nb = nodeIdx(tk(el.id, 1));
      const u = V[na] - V[nb];
      res.elements[el.id] = { voltage: Math.abs(u), current: 0 };
    }
  }

  const sourceCurrent = Math.abs(x[Mn]) || 0;
  res.totalCurrent = sourceCurrent;
  res.status = sourceCurrent > 1e-3 ? '通路' : '断路';
  res.live = live || sourceCurrent > 1e-3;

  /* 无有效负载判定短路 */
  let hasEffectiveLoad = false;
  for (const r of resistors) {
    if (!r.el) continue;
    const t = r.el.type;
    if (t === 'lamp' || t === 'bell' || t === 'motor') { hasEffectiveLoad = true; break; }
    if (t === 'resistor' && Number(r.el.props.resistance) > 0) { hasEffectiveLoad = true; break; }
    if (t === 'resistanceBox' && Number(r.el.props.resistance) > 0) { hasEffectiveLoad = true; break; }
  }
  if (!hasEffectiveLoad) {
    for (const el of elements) {
      if (el.type !== 'rheostat') continue;
      const rawR = Number(el.props.resistance);
      if (isNaN(rawR) || rawR <= 0) continue;
      const connected = [0, 1, 2].some(i =>
        wires.some(w =>
          (w.a.el === el.id && w.a.term === i) ||
          (w.b.el === el.id && w.b.term === i)
        )
      );
      if (connected) { hasEffectiveLoad = true; break; }
    }
  }

  if ((overload || !hasEffectiveLoad) && sourceCurrent > 1e-3) {
    res.shortCircuit = true;
    res.live = true;
    res.status = '短路';
  }

  simResult = res;
}

/* =========================================================
   10. 渲染
   ========================================================= */
function refdesSVG(el) {
  if (!el.refdes) return '';
  const basePos = SHAPES[el.type].refPos || { x: 0, y: -30 };
  const pos = rotPt(basePos, el.rotation || 0);
  const mainSize = 15;
  const subSize  = 10;
  const dy       = 5;
  return `<text class="refletter" x="${pos.x}" y="${pos.y}"
            style="font-size:${mainSize}px">${el.refdes.main}<tspan dy="${dy}"
            style="font-size:${subSize}px">${el.refdes.sub}</tspan></text>`;
}

function meterReadout(el) {
  if (el.type === 'ammeter') {
    const d = simResult.elements[el.id];
    const v = d ? Math.abs(d.current) : 0;
    return v.toFixed(3) + ' A';
  }
  if (el.type === 'voltmeter') {
    const d = simResult.elements[el.id];
    const v = d ? d.voltage : 0;
    return v.toFixed(2) + ' V';
  }
  return '';
}

function render() {
  let out = '';

  for (const w of wires) {
    const A = getTerm(w.a), B = getTerm(w.b);
    if (!A || !B) continue;
    const d = rectPath(routeWire(A.pos, A.dir, B.pos, B.dir));
    const sel = selected && selected.kind === 'wire' && selected.id === w.id;
    out += `<g class="wire${sel ? ' selected' : ''}" data-wire="${w.id}">
      <path class="wire-hit" d="${d}"/>
      <path class="wire-line" d="${d}"/>
    </g>`;
  }

  for (const el of elements) {
    const s = SHAPES[el.type];
    const sel = selected && selected.kind === 'el' && selected.id === el.id;
    const rot = el.rotation || 0;
    out += `<g class="element${sel ? ' selected' : ''}" data-el="${el.id}" transform="translate(${el.x} ${el.y})">`;
    /* 符号旋转 */
    out += `<g transform="rotate(${rot})">${s.draw(el)}</g>`;
    /* 参考符号：位置旋转，文字不旋转 */
    out += refdesSVG(el);

    /* 接线柱：位置旋转后的本地坐标 */
    s.terminals.forEach((t, i) => {
      if (!isTermVisible(el, i)) return;
      const local = getTermLocalPos(el, i);
      if (!local) return;
      const pos = rotPt(local, rot);
      out += `<circle class="hit" cx="${pos.x}" cy="${pos.y}" r="13" data-el="${el.id}" data-term="${i}"/>`;
      out += `<circle class="dot-t" cx="${pos.x}" cy="${pos.y}" r="4"/>`;
    });

    /* 数值标签：位置固定在下方（不旋转） */
    if (s.label) {
      const txt = s.label(el);
      if (txt) out += `<text class="el-label" x="0" y="40">${txt}</text>`;
    }

    /* 仪表读数：固定在下方 */
    const ro = meterReadout(el);
    if (ro) out += `<text class="el-readout" x="0" y="44">${ro}</text>`;

    out += `</g>`;
  }

  if (dragging && dragging.kind === 'wire') {
    const A = getTerm({ el: dragging.fromEl, term: dragging.fromTerm });
    if (A) out += `<path class="temp-wire" d="${tempPath(A, { x: dragging.x, y: dragging.y })}"/>`;
  }

  canvas.innerHTML = out;
}

/* =========================================================
   11. 读数面板
   ========================================================= */
function teacherBadgeHTML() {
  if (!teacherMode) return '';
  return `<div class="ro-teacher">👩‍🏫 ${teacherName}老师 · 教师模式</div>`;
}

function updateReadout() {
  const r = simResult;
  const badge = teacherBadgeHTML();

  if (!r.hasSource) {
    readout.innerHTML = `
      ${badge}
      <div class="ro-title">📊 电路读数</div>
      <div class="ro-row"><span>状态</span><b class="off">无电源</b></div>
      <div class="ro-sub">放置电源并连成回路</div>`;
    return;
  }

  if (r.shortCircuit) {
    readout.innerHTML = `
      ${badge}
      <div class="ro-title">📊 电路读数</div>
      <div class="ro-row"><span>电路状态</span><b class="off">电源短路</b></div>
      <div class="ro-row"><span>电源电压</span><b>${r.sourceVoltage.toFixed(2)} V</b></div>
      <div class="ro-sub" style="color:#dc2626">⚠️ 电流极大，请立即检查</div>`;
    return;
  }

  const ok = r.status === '通路';
  let h = `${badge}
    <div class="ro-title">📊 电路读数</div>
    <div class="ro-row"><span>电路状态</span><b class="${ok ? 'ok' : 'off'}">${r.status}</b></div>
    <div class="ro-row"><span>电源电压</span><b>${r.sourceVoltage.toFixed(2)} V</b></div>
    <div class="ro-row"><span>总电流</span><b>${r.totalCurrent.toFixed(3)} A</b></div>`;

  const lamps = elements.filter(e => e.type === 'lamp');
  if (lamps.length) {
    h += `<div class="ro-sep"></div>`;
    lamps.forEach(el => {
      const d = r.elements[el.id];
      const cur = d ? Math.abs(d.current) : 0;
      const lit = d && d.lit;
      const volt = d ? d.voltage : 0;
      const name = el.refdes ? el.refdes.main + el.refdes.sub : '灯泡';
      h += `<div class="ro-row"><span>${name}</span>
              <b class="${lit ? 'ok' : 'off'}">${lit ? '亮' : '灭'} · ${cur.toFixed(3)}A · ${volt.toFixed(2)}V</b></div>`;
    });
  }

  const meters = elements.filter(e => e.type === 'ammeter' || e.type === 'voltmeter');
  if (meters.length) {
    h += `<div class="ro-sep"></div>`;
    meters.forEach(el => {
      const d = r.elements[el.id] || { voltage: 0, current: 0 };
      const name = el.refdes ? el.refdes.main + el.refdes.sub : (el.type === 'ammeter' ? '电流表' : '电压表');
      const val = el.type === 'ammeter'
        ? Math.abs(d.current).toFixed(3) + ' A'
        : d.voltage.toFixed(2) + ' V';
      h += `<div class="ro-row"><span>${name}</span><b>${val}</b></div>`;
    });
  }

  readout.innerHTML = h;
}

/* =========================================================
   12. 刷新
   ========================================================= */
let lastShortState = false;
let shortCooldownUntil = 0;

function refresh() {
  simulate();
  render();
  updateReadout();

  const now = Date.now();
  if (simResult.shortCircuit) {
    if (!lastShortState && now > shortCooldownUntil) {
      showShortCircuitCard();
      shortCooldownUntil = now + 2500;
    }
    lastShortState = true;
  } else {
    lastShortState = false;
  }
}

/* =========================================================
   13. 增删查
   ========================================================= */
function nextRefdes(type) {
  const prefix = PREFIX_MAP[type] || 'X';
  let maxN = 0;
  elements.forEach(e => {
    if (e.type === type && e.refdes && e.refdes.sub) {
      const n = parseInt(e.refdes.sub, 10);
      if (n > maxN) maxN = n;
    }
  });
  return { main: prefix, sub: String(maxN + 1) };
}

function addElement(type, x, y) {
  if (isShortLocked()) {
    warnLive('添加元件');
    return null;
  }
  teacherWarnIfLive();

  const shape = SHAPES[type];
  const el = {
    id: 'e' + (++uid),
    type,
    x: snap(x),
    y: snap(y),
    rotation: 0,
    props: Object.assign({}, shape.defaults),
    refdes: nextRefdes(type)
  };
  elements.push(el);
  selected = { kind: 'el', id: el.id };
  refresh();
  renderProps();
  return el;
}

function addWire(aEl, aTerm, bEl, bTerm) {
  if (aEl === bEl && aTerm === bTerm) return;
  const dup = wires.some(w =>
    (w.a.el === aEl && w.a.term === aTerm && w.b.el === bEl && w.b.term === bTerm) ||
    (w.a.el === bEl && w.a.term === bTerm && w.b.el === aEl && w.b.term === aTerm)
  );
  if (dup) return;
  wires.push({ id: 'w' + (++uid), a: { el: aEl, term: aTerm }, b: { el: bEl, term: bTerm } });
}

function deleteSelected() {
  if (!selected) return;

  if (selected.kind === 'el') {
    const el = elements.find(e => e.id === selected.id);
    if (!el) return;

    if (isLiveLocked() && el.type !== 'switch' && el.type !== 'battery') {
      warnLive('删除用电器/仪表');
      return;
    }
    teacherWarnIfLive();

    elements = elements.filter(e => e.id !== selected.id);
    wires    = wires.filter(w => w.a.el !== selected.id && w.b.el !== selected.id);
  } else {
    if (isLiveLocked()) {
      warnLive('删除导线');
      return;
    }
    teacherWarnIfLive();

    wires = wires.filter(w => w.id !== selected.id);
  }

  selected = null;
  refresh();
  renderProps();
}

function deleteWireById(wid) {
  if (isLiveLocked()) {
    warnLive('删除导线');
    return false;
  }
  teacherWarnIfLive();

  const before = wires.length;
  wires = wires.filter(w => w.id !== wid);
  if (wires.length === before) return false;
  if (selected && selected.kind === 'wire' && selected.id === wid) selected = null;
  refresh();
  renderProps();
  return true;
}

/** 旋转选中的元件 90°（改变接线柱方向，按带电操作处理） */
function rotateSelected() {
  if (!selected || selected.kind !== 'el') return;
  const el = elements.find(e => e.id === selected.id);
  if (!el) return;

  if (isLiveLocked()) { warnLive('旋转元件'); return; }
  if (isShortLocked()) { warnLive('旋转元件'); return; }
  teacherWarnIfLive();

  el.rotation = ((el.rotation || 0) + 90) % 360;
  refresh();
  renderProps();
}

function findTerminalNear(pt, skipEl, skipTerm, maxDist = 32) {
  let best = null, bestD = maxDist;
  for (const el of elements) {
    const terms = SHAPES[el.type].terminals;
    for (let i = 0; i < terms.length; i++) {
      if (el.id === skipEl && i === skipTerm) continue;
      if (!isTermVisible(el, i)) continue;
      const T = getTermGlobal(el, i);
      if (!T) continue;
      const d = Math.hypot(T.pos.x - pt.x, T.pos.y - pt.y);
      if (d < bestD) { bestD = d; best = { elId: el.id, term: i }; }
    }
  }
  return best;
}

/* =========================================================
   14. 属性面板
   ========================================================= */
function renderProps() {
  if (!selected) {
    propsPanel.innerHTML = '<div class="props-empty">选中元件或导线后<br>可在此调节参数</div>';
    return;
  }

  const liveLock = isLiveLocked();
  const shortLock = isShortLocked();

  if (selected.kind === 'wire') {
    const canDelete = !liveLock;
    propsPanel.innerHTML = `
      <div class="props-title">导线</div>
      ${liveLock ? `<div class="lock-hint">⚡ 电路带电，导线不能删除。请先断开开关（或移除电源）。</div>` : ''}
      ${shortLock ? `<div class="lock-hint" style="color:#b91c1c;border-color:#fecaca;background:#fef2f2">⚡ 电源短路，请删除导线或元件修复电路。</div>` : ''}
      <div class="hint">双击画布上的导线，或点击下方按钮，即可只删除这一根导线。</div>
      <button class="del-btn" id="delBtn" ${canDelete ? '' : 'disabled'}>删除这根导线</button>
    `;
    return;
  }

  const el = elements.find(e => e.id === selected.id);
  if (!el) { propsPanel.innerHTML = ''; return; }
  const s = SHAPES[el.type];
  const refName = el.refdes ? el.refdes.main + el.refdes.sub : '';

  const isSwitch = el.type === 'switch';
  const isBattery = el.type === 'battery';

  const canDelete = shortLock || !liveLock || isSwitch || isBattery;
  const canEditParam = !liveLock && !shortLock;
  const canRotate = !liveLock && !shortLock;

  let h = `<div class="props-title">${s.name} <span style="color:#7d8db0;font-size:.72rem">${refName}</span></div>`;

  if (liveLock && !isSwitch && !isBattery) {
    h += `<div class="lock-hint">⚡ 电路带电，用电器不能删除、参数锁定。请先断开开关，或移除电源。</div>`;
  } else if (liveLock && isSwitch) {
    h += `<div class="lock-hint">⚡ 电路带电，可以先断开开关，再继续操作。</div>`;
  } else if (liveLock && isBattery) {
    h += `<div class="lock-hint">⚡ 电路带电，可以移除电源切断电路。</div>`;
  }
  if (shortLock) {
    h += `<div class="lock-hint" style="color:#b91c1c;border-color:#fecaca;background:#fef2f2">⚡ 电源短路，请先删除导线或元件修复电路。</div>`;
  }

  if (el.type === 'battery') {
    h += `<label>电压 <input type="number" min="1" max="220" step="1"
            value="${el.props.voltage}" data-prop="voltage" ${canEditParam ? '' : 'disabled'}> V</label>`;
  }
  if (el.type === 'resistor') {
    h += `<label>阻值 <input type="number" min="0" max="10000" step="1"
            value="${el.props.resistance}" data-prop="resistance" ${canEditParam ? '' : 'disabled'}> Ω</label>`;
  }
  if (el.type === 'rheostat') {
    const max = Number(el.props.max) || 20;
    const res = Number(el.props.resistance ?? max / 2);
    h += `<label>最大阻值 <input type="number" min="1" max="10000" step="1"
            value="${max}" data-prop="max" ${canEditParam ? '' : 'disabled'}> Ω</label>`;
    h += `<div class="slider-row">
            <input type="range" min="0" max="${max}" step="0.1" value="${res}"
              data-prop="resistance" ${canEditParam ? '' : 'disabled'}>
          </div>`;
    h += `<label>阻值 <input type="number" min="0" max="${max}" step="0.1"
            value="${res.toFixed(1)}" data-prop="resistance" ${canEditParam ? '' : 'disabled'}> Ω</label>`;
    h += `<div class="hint">拖动滑块或直接输入阻值，两者同步。左/右接线柱任选其一，另一个会整段隐藏。</div>`;
  }
  if (el.type === 'resistanceBox') {
    h += `<label>阻值 <input type="number" min="0" max="9999" step="1"
            value="${el.props.resistance}" data-prop="resistance" ${canEditParam ? '' : 'disabled'}> Ω</label>`;
  }
  if (el.type === 'switch') {
    h += `<label><input type="checkbox" ${el.props.closed ? 'checked' : ''}
            data-prop="closed"> 开关闭合（${refName}）</label>`;
  }

  h += `<button class="rotate-btn" id="rotateBtn" ${canRotate ? '' : 'disabled'}>
          ↻ 旋转 90°（当前 ${el.rotation || 0}°）
        </button>`;

  let delLabel = '删除元件（含相连导线）';
  if (liveLock && isBattery) delLabel = '移除电源（断电）';
  if (liveLock && isSwitch) delLabel = '删除开关（断电）';

  h += `<button class="del-btn" id="delBtn" ${canDelete ? '' : 'disabled'}>${delLabel}</button>`;
  propsPanel.innerHTML = h;
}

const PARAM_PROPS = ['voltage', 'resistance', 'max'];

propsPanel.addEventListener('input', e => {
  const inp = e.target;
  const prop = inp.dataset.prop;
  if (!prop || !selected || selected.kind !== 'el') return;
  const el = elements.find(x => x.id === selected.id);
  if (!el) return;

  if (PARAM_PROPS.includes(prop) && (isLiveLocked() || isShortLocked())) return;

  /* 开关通断是安全操作，不算带电操作 */
  const isSwitchToggle = (prop === 'closed' && el.type === 'switch');
  if (!isSwitchToggle) teacherWarnIfLive();

  if (inp.type === 'checkbox') {
    el.props[prop] = inp.checked;
  } else if (el.type === 'rheostat' && prop === 'resistance') {
    let v = parseFloat(inp.value);
    if (isNaN(v)) v = 0;
    const max = Number(el.props.max) || 20;
    v = Math.max(0, Math.min(v, max));
    el.props.resistance = v;
    propsPanel.querySelectorAll(`[data-prop="resistance"]`).forEach(o => {
      if (o !== inp) o.value = v;
    });
    refresh();
    return;
  } else if (el.type === 'rheostat' && prop === 'max') {
    let v = parseFloat(inp.value);
    if (isNaN(v) || v < 1) v = 1;
    el.props.max = v;
    if (Number(el.props.resistance) > v) el.props.resistance = v;
    refresh();
    renderProps();
    return;
  } else {
    const v = parseFloat(inp.value);
    el.props[prop] = isNaN(v) ? 0 : v;
  }
  refresh();
});

propsPanel.addEventListener('click', e => {
  if (e.target.id === 'rotateBtn' && !e.target.disabled) rotateSelected();
  if (e.target.id === 'delBtn' && !e.target.disabled) deleteSelected();
});

/* =========================================================
   15. 元件库渲染 & 拖拽到画布
   ========================================================= */
function renderPalette() {
  paletteGrid.innerHTML = Object.entries(SHAPES).map(([type, s]) => `
    <div class="pal-item" data-type="${type}">
      <svg viewBox="-60 -50 120 100" preserveAspectRatio="xMidYMid meet">
        ${s.draw({ props: Object.assign({}, s.defaults), _lit: false })}
      </svg>
      <span>${s.name}</span>
    </div>
  `).join('');
}

paletteGrid.addEventListener('pointerdown', e => {
  const item = e.target.closest('[data-type]');
  if (!item) return;
  e.preventDefault();

  if (isShortLocked()) {
    warnLive('添加元件');
    return;
  }
  teacherWarnIfLive();

  const type = item.dataset.type;

  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.innerHTML = `<svg viewBox="-60 -50 120 100">
    ${SHAPES[type].draw({ props: Object.assign({}, SHAPES[type].defaults), _lit: false })}
  </svg>`;
  document.body.appendChild(ghost);

  const moveGhost = ev => {
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top  = ev.clientY + 'px';
  };
  moveGhost(e);

  const finish = ev => {
    window.removeEventListener('pointermove', moveGhost);
    window.removeEventListener('pointerup', finish);
    ghost.remove();

    const r = canvas.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right &&
        ev.clientY >= r.top  && ev.clientY <= r.bottom) {
      addElement(type, ev.clientX - r.left, ev.clientY - r.top);
    }
  };

  window.addEventListener('pointermove', moveGhost);
  window.addEventListener('pointerup', finish);
});

/* =========================================================
   16. 画布交互
   ========================================================= */
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function alignSnap(el, x, y) {
  for (const other of elements) {
    if (other.id === el.id) continue;
    if (Math.abs(other.y - y) < ALIGN_SNAP) y = other.y;
    if (Math.abs(other.x - x) < ALIGN_SNAP) x = other.x;
  }
  return { x: snap(x), y: snap(y) };
}

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const pt = toCanvas(e);

  const termEl = e.target.closest('[data-term]');
  if (termEl) {
    if (isLiveLocked() || isShortLocked()) {
      warnLive('接线');
      return;
    }
    teacherWarnIfLive();
    dragging = {
      kind: 'wire',
      fromEl: termEl.getAttribute('data-el'),
      fromTerm: parseInt(termEl.getAttribute('data-term'), 10),
      x: pt.x, y: pt.y
    };
    canvas.setPointerCapture(e.pointerId);
    render();
    return;
  }

  const wireEl = e.target.closest('[data-wire]');
  if (wireEl) {
    selected = { kind: 'wire', id: wireEl.getAttribute('data-wire') };
    render();
    renderProps();
    return;
  }

  const elG = e.target.closest('[data-el]');
  if (elG) {
    const id = elG.getAttribute('data-el');
    const el = elements.find(x => x.id === id);
    if (el) {
      selected = { kind: 'el', id };
      render();
      renderProps();

      if (isShortLocked()) {
        warnLive('移动元件');
        return;
      }
      dragging = { kind: 'move', id, offX: pt.x - el.x, offY: pt.y - el.y, warned: false };
      canvas.setPointerCapture(e.pointerId);
    }
    return;
  }

  selected = null;
  render();
  renderProps();
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const pt = toCanvas(e);

  if (dragging.kind === 'move') {
    const el = elements.find(x => x.id === dragging.id);
    if (!el) return;

    if (!dragging.warned) {
      dragging.warned = true;
      teacherWarnIfLive();
    }

    const raw = { x: pt.x - dragging.offX, y: pt.y - dragging.offY };
    const aligned = alignSnap(el, raw.x, raw.y);
    el.x = aligned.x;
    el.y = aligned.y;
    render();
  } else if (dragging.kind === 'wire') {
    dragging.x = pt.x;
    dragging.y = pt.y;
    render();
  }
});

canvas.addEventListener('pointerup', e => {
  if (!dragging) return;

  if (dragging.kind === 'wire') {
    const pt = toCanvas(e);
    const hit = findTerminalNear(pt, dragging.fromEl, dragging.fromTerm);
    if (hit) addWire(dragging.fromEl, dragging.fromTerm, hit.elId, hit.term);
  }

  dragging = null;
  refresh();
});

canvas.addEventListener('dblclick', e => {
  const g = e.target.closest('[data-el]');
  if (g) {
    const el = elements.find(x => x.id === g.getAttribute('data-el'));
    if (el && el.type === 'switch') {
      el.props.closed = !el.props.closed;
      refresh();
      renderProps();
    }
    return;
  }

  const w = e.target.closest('[data-wire]');
  if (w) {
    deleteWireById(w.getAttribute('data-wire'));
  }
});

window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selected) { e.preventDefault(); deleteSelected(); }
    return;
  }

  if (e.key === 'r' || e.key === 'R') {
    if (selected && selected.kind === 'el') {
      e.preventDefault();
      rotateSelected();
    }
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!elements.length && !wires.length) return;

  if (isLiveLocked()) {
    warnLive('清空画布');
    return;
  }
  teacherWarnIfLive();

  elements = []; wires = []; selected = null;
  refresh();
  renderProps();
});

/* =========================================================
   17. 启动
   ========================================================= */
updateTeacherBtn();
renderPalette();
refresh();
renderProps();
</script>
</body>
</html>
